# miNatillera Backend — Spring Boot on Lambda
# Configuration is loaded from AWS SSM Parameter Store at startup.
# These properties are minimal since the app runs as a Lambda function.

spring.main.banner-mode=off
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# CORS — set via environment variable CORS_ALLOWED_ORIGIN in Lambda
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:https://localhost:5173}
